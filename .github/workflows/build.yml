name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK (push to main)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: soundstick-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build debug + release APKs (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Release APK files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SoundStick.apk
          ls -lh SoundStick.apk

      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoundStick.apk
          generate_release_notes: true
          body: |
            ## Download & install

            1. Download **SoundStick.apk** below (Assets section).
            2. Open it on your Android phone. If asked, allow **"Install unknown apps"** for your browser / Files app.
            3. Install, open the app, and make your first sound sticker.

            ## SoundStick - WhatsApp Sound Stickers

            Create stickers from your photos and videos, attach a sound to each one (your voice, an audio file, built-in effects, text-to-speech, or the video's own sound), organize them into packs, add packs to WhatsApp, and share stickers WITH their sound as short videos.
